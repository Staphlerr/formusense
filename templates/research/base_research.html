{% extends 'base.html' %}
{% block content %}
<style>
  .research-page{margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);width:auto;max-width:none;box-sizing:border-box;padding-left:40px;padding-right:40px}
  .rd-layout{grid-template-columns:220px 1fr;max-width:1760px;margin-left:auto;margin-right:auto}
  .rd-sidebar{border-right:1px solid var(--line);padding-right:22px;align-content:start}
  .rd-content{min-width:0}
  .rd-content>*+*{margin-top:28px}
  .rd-content .stack{gap:22px}
  .rd-content .two-column{align-items:stretch}
  .rd-content .two-column>.card{display:flex;flex-direction:column;height:100%;margin-bottom:0}
  .rd-content .manifesto h2{font-size:1.7rem;margin-bottom:.3em}
  .rd-content .rd-kicker{display:block;text-transform:uppercase;letter-spacing:.07em;font-weight:700;font-size:.72rem;color:var(--outline);margin:0 0 6px}
  .rd-content .rd-empty{padding:16px 18px}
  .rd-spinner{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:rd-spin .7s linear infinite;vertical-align:-2px;margin-right:6px;opacity:.85}
  @keyframes rd-spin{to{transform:rotate(360deg)}}
  @media (max-width:800px){.research-page{padding-left:20px;padding-right:20px}.rd-sidebar{border-right:0;border-bottom:1px solid var(--line);padding-right:0;padding-bottom:14px}}
</style>
<section class="page research-page">
  <div class="rd-layout">
    <aside class="rd-sidebar" aria-label="Navigasi R&D">
      <p class="fine-print" style="text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--outline);margin:0 0 4px">R&D · Formulation Intelligence</p>
      <a href="{% url 'research:overview' %}" {% if request.resolver_match.url_name == 'overview' %}style="color:var(--wine);background:var(--surface-container)"{% endif %}>Overview</a>
      <a href="{% url 'research:unmet_demand' %}" {% if request.resolver_match.url_name == 'unmet_demand' %}style="color:var(--wine);background:var(--surface-container)"{% endif %}>Peluang Shade</a>
      <a href="{% url 'research:evidence' %}" {% if request.resolver_match.url_name == 'evidence' %}style="color:var(--wine);background:var(--surface-container)"{% endif %}>Consumer Evidence</a>
      <a href="{% url 'research:formula_lab' %}" {% if request.resolver_match.url_name == 'formula_lab' %}style="color:var(--wine);background:var(--surface-container)"{% endif %}>Formula Lab</a>
    </aside>
    <div class="rd-content">{% block research_content %}{% endblock %}</div>
  </div>
</section>
<script>
  document.addEventListener('submit', function (e) {
    var form = e.target;
    var btn = form.querySelector('button[type="submit"][data-loading-text]');
    if (!btn || btn.disabled) return;
    btn.dataset.originalText = btn.innerHTML;
    btn.innerHTML = '<span class="rd-spinner" aria-hidden="true"></span>' + btn.dataset.loadingText;
    btn.disabled = true;
  });
</script>
{% endblock %}
